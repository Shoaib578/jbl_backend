<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('admin_routes.dashboard') }}">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_routes.dashboard') }}">Dashboard</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_routes.products') }}">Products</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_routes.reviews') }}">Reviews</a></li>

                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('admin_routes.users') }}">Users</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="{{ url_for('admin_routes.logout') }}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Users Management</h2>
        <p>Below is the list of all registered users.</p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td><input type="text" class="form-control username" value="{{ user.username }}" data-id="{{ user.id }}"></td>
                            <td><input type="email" class="form-control email" value="{{ user.email }}" data-id="{{ user.id }}"></td>
                            <td>
                                <select class="form-control is-admin" data-id="{{ user.id }}">
                                    <option value="true" {% if user.is_admin %}selected{% endif %}>Yes</option>
                                    <option value="false" {% if not user.is_admin %}selected{% endif %}>No</option>
                                </select>
                            </td>
                            <td>
                                <input type="password" class="form-control password" placeholder="New Password (Optional)" data-id="{{ user.id }}">
                            </td>
                            <td>
                                <button class="btn btn-success btn-sm update-btn" data-id="{{ user.id }}">Save</button>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
                
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.update-btn').forEach(button => {
            button.addEventListener('click', function () {
                const userId = this.getAttribute('data-id');
                const username = document.querySelector(`.username[data-id="${userId}"]`).value;
                const email = document.querySelector(`.email[data-id="${userId}"]`).value;
                const isAdmin = document.querySelector(`.is-admin[data-id="${userId}"]`).value === 'true';

                fetch(`/admin/users/update/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, is_admin: isAdmin })
                })
                .then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error('Error:', error));
            });
        });
    </script>
</body>
</html>
